name: Testes
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['dashboard/**', 'modulos/**', 'docs/**']
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
